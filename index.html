<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>우리 캘린더</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#8a3fae" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="우리 캘린더" />
<link rel="apple-touch-icon" href="icon-180.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b1f3d; --sub:#8a7ba3; --bg:#fff6f1; --card:#ffffff; --accent:#8a3fae;
    --date:#ff6b9d; --anniv:#9b6bff; --appt:#38bdf8; --trip:#2dd4bf;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Nanum Gothic',sans-serif; background:var(--bg); color:var(--ink);
    overscroll-behavior:none; -webkit-font-smoothing:antialiased;
  }
  #app{ max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding-bottom:76px; position:relative; }

  .app-header{ padding:calc(env(safe-area-inset-top) + 18px) 20px 14px; }
  .app-header h1{ font-family:'Baloo 2'; font-size:20px; margin:0; color:var(--ink); }
  .app-header .sub{ font-size:12px; color:var(--sub); margin-top:2px; }

  .tab{ display:none; flex:1; padding:0 20px 20px; }
  .tab.active{ display:block; }

  .dday-card{
    background:linear-gradient(135deg, #ffd9c7, #f2b9d4); border-radius:20px; padding:20px;
    color:#5a2a4a; margin-bottom:18px; box-shadow:0 8px 20px rgba(230,160,190,.35);
  }
  .dday-card .dlabel{ font-size:11px; font-weight:800; opacity:.75; }
  .dday-card .dvalue{ font-family:'Baloo 2'; font-size:26px; font-weight:800; margin:4px 0 2px; }
  .dday-card .ddate{ font-size:11px; opacity:.8; font-weight:700; }

  .section-title{ font-size:13px; font-weight:800; color:var(--sub); margin:18px 0 10px; padding:0 2px; }

  .event-item{
    display:flex; align-items:center; gap:12px; background:var(--card); border-radius:16px;
    padding:12px 14px; margin-bottom:8px; box-shadow:0 3px 10px rgba(180,140,190,.1);
  }
  .event-item .icon-chip{
    width:36px; height:36px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:18px; flex-shrink:0; box-shadow:0 3px 8px rgba(0,0,0,.12);
  }
  .event-item .icon-stack{ position:relative; flex-shrink:0; }
  .event-item .avatar-group{ position:absolute; top:-6px; right:-7px; display:flex; }
  .event-item .avatar-group .av{
    width:15px; height:15px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.28);
    display:flex; align-items:center; justify-content:center; font-size:9px; border:1.2px solid #fff;
  }
  .event-item .avatar-group .av:not(:first-child){ margin-left:-5px; }
  .event-item .etxt{ flex:1; min-width:0; }
  .event-item .etitle{ font-size:13.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .event-item .emeta{ font-size:11px; color:var(--sub); font-weight:700; margin-top:2px; }
  .event-item .edel{ border:none; background:none; color:#d8c3e0; font-size:16px; cursor:pointer; padding:6px; }

  .empty-state{ text-align:center; padding:30px 10px; color:var(--sub); font-size:12.5px; line-height:1.7; }

  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cal-nav button{ border:none; background:var(--card); width:34px; height:34px; border-radius:50%; font-size:14px; color:var(--accent); box-shadow:0 3px 8px rgba(180,140,190,.14); cursor:pointer; }
  .cal-nav .cmonth{ font-family:'Baloo 2'; font-size:16px; font-weight:700; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; background:var(--card); border-radius:18px; padding:14px; box-shadow:0 4px 14px rgba(180,140,190,.12); margin-bottom:16px; }
  .cal-dow{ text-align:center; font-size:10px; font-weight:800; color:var(--sub); padding-bottom:4px; }
  .cal-cell{ position:relative; height:44px; border-radius:10px; display:flex; flex-direction:column; align-items:center; padding-top:4px; cursor:pointer; }
  .cal-cell.other{ opacity:.25; }
  .cal-cell .dnum{ font-family:'Baloo 2'; font-size:12px; font-weight:700; }
  .cal-cell.today{ background:#fbf0fb; }
  .cal-cell.today .dnum{ color:var(--accent); font-weight:800; }
  .cal-cell.selected{ box-shadow:0 0 0 1.6px var(--accent) inset; }
  .cal-cell .dots{ display:flex; gap:1.5px; margin-top:3px; }
  .cal-cell .cal-av{
    width:11px; height:11px; border-radius:50%; background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:7px;
    box-shadow:0 1px 2px rgba(0,0,0,.18);
  }
  .cal-cell .cal-heart{ font-size:11px; line-height:1; }
  .cal-cell .cal-more{ font-size:7px; font-weight:800; color:var(--sub); align-self:center; margin-left:1px; }

  .field-group{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .field-label{ font-size:11.5px; font-weight:800; color:var(--sub); padding:0 2px; }
  .title-input{
    width:100%; border:none; border-radius:14px; background:var(--card); padding:13px 14px;
    font-size:14px; font-family:'Nanum Gothic'; font-weight:700; color:var(--ink);
    box-shadow:0 3px 10px rgba(180,140,190,.12); outline:none;
  }
  .icon-picker{ display:grid; grid-template-columns:repeat(6,1fr); gap:8px; background:var(--card); border-radius:14px; padding:12px; box-shadow:0 3px 10px rgba(180,140,190,.12); }
  .icon-opt{ aspect-ratio:1/1; border-radius:11px; border:none; background:#faf3f8; font-size:17px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .icon-opt.active{ background:var(--accent); box-shadow:0 4px 10px rgba(138,63,174,.35); }
  .cat-row{ display:flex; gap:8px; }
  .cat-chip{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 4px; border-radius:14px; background:var(--card); border:2px solid transparent; cursor:pointer; box-shadow:0 3px 10px rgba(180,140,190,.1); }
  .cat-chip .dot{ width:16px; height:16px; border-radius:50%; }
  .cat-chip span{ font-size:10.5px; font-weight:800; color:var(--sub); }
  .cat-chip.active{ border-color:var(--cc); }
  .cat-chip.active span{ color:var(--ink); }

  .who-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .who-chip{
    flex:1; min-width:64px; display:flex; flex-direction:column; align-items:center; gap:6px;
    background:var(--card); border-radius:14px; padding:12px 6px; border:2px solid transparent;
    cursor:pointer; transition:.15s; box-shadow:0 3px 10px rgba(180,140,190,.1);
  }
  .who-chip .a-circle{ width:32px; height:32px; border-radius:50%; background:#faf3f8; display:flex; align-items:center; justify-content:center; font-size:17px; box-shadow:0 2px 6px rgba(0,0,0,.1); }
  .who-chip span{ font-size:10.5px; font-weight:800; color:var(--sub); max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .who-chip.active{ border-color:var(--accent); background:#fbf3ff; }
  .who-chip.active .a-circle{ box-shadow:0 0 0 2px var(--accent), 0 2px 6px rgba(0,0,0,.1); }
  .who-chip.active span{ color:var(--accent); }
  .who-hint{ font-size:10px; color:var(--sub); padding:4px 2px 0; }
  .row2{ display:flex; gap:8px; }
  .field{ flex:1; background:var(--card); border-radius:14px; padding:11px 13px; box-shadow:0 3px 10px rgba(180,140,190,.12); display:flex; flex-direction:column; gap:3px; }
  .field .flabel{ font-size:9.5px; font-weight:800; color:var(--sub); }
  .field input[type="date"], .field input[type="time"]{ border:none; background:transparent; font-family:'Nanum Gothic'; font-weight:800; font-size:13px; color:var(--ink); outline:none; padding:0; width:100%; }
  textarea.memo{ width:100%; min-height:60px; border:none; border-radius:14px; background:var(--card); padding:12px 13px; font-family:'Nanum Gothic'; font-size:12.5px; font-weight:700; color:var(--ink); box-shadow:0 3px 10px rgba(180,140,190,.12); outline:none; resize:none; }
  .save-btn{ width:100%; border:none; border-radius:16px; padding:14px; font-family:'Baloo 2'; font-size:15px; font-weight:700; background:#e7dcf0; color:#b3a3c8; cursor:pointer; transition:.2s; }
  .save-btn.ready{ background:var(--accent); color:#fff; box-shadow:0 8px 20px rgba(138,63,174,.32); }
  .save-btn:disabled{ opacity:.6; }

  .profile-card{ background:var(--card); border-radius:18px; padding:16px; box-shadow:0 4px 14px rgba(180,140,190,.14); display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .avatar-big{ width:52px; height:52px; border-radius:50%; background:#faf3f8; display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0; cursor:pointer; }
  .avatar-big.empty{ border:2px dashed #d8c3e0; background:#fff; color:#c9b3d8; font-size:20px; }
  .name-input{ border:none; border-bottom:2px solid #f1e4ee; background:transparent; font-family:'Baloo 2'; font-size:15px; font-weight:700; color:var(--ink); padding:2px 0 4px; outline:none; width:100%; }
  .name-input::placeholder{ color:#c9b3d8; font-weight:600; }
  .name-input.warn{ border-bottom-color:#ff6b9d; }

  .invite-card{ background:#fbf3ff; border-radius:16px; padding:16px; text-align:center; margin-bottom:12px; }
  .invite-card p{ font-size:11.5px; color:var(--accent); font-weight:700; line-height:1.6; margin:0 0 10px; }
  .invite-btn{ border:none; background:var(--accent); color:#fff; font-size:12.5px; font-weight:800; padding:10px 18px; border-radius:12px; cursor:pointer; }

  .room-panel{ background:var(--card); border-radius:16px; padding:14px; box-shadow:0 4px 14px rgba(180,140,190,.14); margin-bottom:14px; }
  .room-tabs{ display:flex; gap:8px; background:#faf3f8; padding:4px; border-radius:999px; margin-bottom:12px; }
  .rtab{ flex:1; border:none; background:none; padding:8px; border-radius:999px; font-size:11.5px; font-weight:800; color:var(--sub); cursor:pointer; }
  .rtab.active{ background:#fff; color:var(--accent); box-shadow:0 2px 6px rgba(0,0,0,.08); }
  .rpane{ display:none; }
  .rpane.active{ display:block; }
  .code-box-mini{ text-align:center; }
  .code-box-mini .clabel{ font-size:10.5px; font-weight:800; color:var(--sub); margin-bottom:6px; }
  .code-box-mini .cvalue{ font-family:'Baloo 2'; font-size:17px; font-weight:800; color:var(--accent); margin-bottom:10px; word-break:break-all; }
  .pw-input-mini{
    width:100%; border:none; background:#faf3f8; border-radius:11px; padding:11px; text-align:center;
    font-family:'Baloo 2'; font-size:15px; font-weight:800; color:var(--ink); outline:none; margin-bottom:10px; letter-spacing:.08em;
  }
  .join-error{ color:#e0405f; font-size:10.5px; font-weight:800; margin-top:8px; min-height:14px; }

  .install-tip{ font-size:11px; color:var(--sub); line-height:1.7; background:var(--card); border-radius:14px; padding:14px; box-shadow:0 3px 10px rgba(180,140,190,.1); }

  .tabbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
    background:rgba(255,246,241,.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-top:1px solid #f1e4ee; display:flex; padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);
  }
  .tabbtn{ flex:1; border:none; background:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; cursor:pointer; color:var(--sub); }
  .tabbtn .ic{ font-size:19px; }
  .tabbtn .lb{ font-size:9.5px; font-weight:800; }
  .tabbtn.active{ color:var(--accent); }

  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:#2b1f3d; color:#fff; font-size:12px; font-weight:700; padding:10px 18px; border-radius:999px;
    transition:.25s; pointer-events:none; z-index:50; max-width:80%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">

  <!-- ═══ 홈 ═══ -->
  <div class="tab active" id="tab-home">
    <div class="app-header"><h1>안녕하세요 👋</h1><div class="sub" id="todayLabel"></div></div>

    <div class="dday-card">
      <div class="dlabel">오늘</div>
      <div class="dvalue" id="homeDate">8월 26일</div>
      <div class="ddate" id="homeCount">등록된 일정 0개</div>
    </div>

    <div class="section-title">오늘 일정</div>
    <div id="todayList"></div>

    <div class="section-title">다가오는 일정</div>
    <div id="upcomingList"></div>
  </div>

  <!-- ═══ 캘린더 ═══ -->
  <div class="tab" id="tab-calendar">
    <div class="app-header"><h1>캘린더</h1></div>
    <div class="cal-nav">
      <button id="prevMonth">‹</button>
      <span class="cmonth" id="calMonthLabel">8월 2026</span>
      <button id="nextMonth">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="section-title" id="calSelLabel">선택한 날짜 일정</div>
    <div id="calSelList"></div>
  </div>

  <!-- ═══ 일정 등록 ═══ -->
  <div class="tab" id="tab-add">
    <div class="app-header"><h1>일정 등록</h1></div>

    <div class="field-group">
      <input class="title-input" id="titleInput" placeholder="예: 카페 데이트" />
    </div>

    <div class="field-group">
      <div class="field-label">아이콘</div>
      <div class="icon-picker" id="iconPicker"></div>
    </div>

    <div class="field-group">
      <div class="field-label">카테고리</div>
      <div class="cat-row" id="catRow"></div>
    </div>

    <div class="field-group" id="whoSection" style="display:none;">
      <div class="field-label">누구의 일정이에요?</div>
      <div class="who-row" id="whoRow"></div>
      <div class="who-hint">여러 명 탭하면 함께하는 일정으로 등록돼요</div>
    </div>

    <div class="field-group">
      <div class="row2">
        <div class="field"><span class="flabel">날짜</span><input type="date" id="dateInput" /></div>
        <div class="field"><span class="flabel">시간</span><input type="time" id="timeInput" value="19:00" /></div>
      </div>
    </div>

    <div class="field-group">
      <div class="field-label">메모</div>
      <textarea class="memo" id="memoInput" placeholder="장소, 준비물 등 자유롭게"></textarea>
    </div>

    <button class="save-btn" id="saveBtn">일정 저장하기</button>
  </div>

  <!-- ═══ 설정 ═══ -->
  <div class="tab" id="tab-settings">
    <div class="app-header"><h1>설정</h1></div>

    <div class="profile-card">
      <div class="avatar-big" id="myAvatar" title="탭해서 아바타 고르기">＋</div>
      <input class="name-input" id="myName" value="" maxlength="8" placeholder="이름을 입력해주세요" />
    </div>

    <div class="icon-picker" id="avatarPicker" style="display:none; margin-bottom:14px;"></div>

    <div class="invite-card" id="inviteCard">
      <p id="roomStatusText">아직 혼자 쓰는 중이에요. 파트너를 초대하면 그 순간부터 함께 쓰는 모드가 열려요.</p>
      <button class="invite-btn" id="inviteBtn">파트너 초대하기</button>
    </div>

    <div class="room-panel" id="roomPanel">
      <div class="room-tabs">
        <button class="rtab active" data-rtab="create">코드 만들기</button>
        <button class="rtab" data-rtab="join">코드 입력하기</button>
      </div>

      <div class="rpane active" id="rpane-create">
        <div class="code-box-mini">
          <input class="pw-input-mini" id="roomPwInput" maxlength="6" inputmode="numeric" placeholder="비밀번호 6자리 직접 설정" />
          <button class="save-btn ready" id="createRoomBtn">코드 발급하고 공유하기</button>
          <div id="roomCodeBox" style="display:none; margin-top:12px;">
            <div class="clabel">이 코드 + 비밀번호를 파트너에게 전달하세요</div>
            <div class="cvalue" id="roomCode">-</div>
            <button class="save-btn ready" id="copyCodeBtn" style="margin-top:8px;">📋 코드+비밀번호 복사하기</button>
          </div>
        </div>
      </div>

      <div class="rpane" id="rpane-join" style="display:none;">
        <input class="title-input" id="joinCodeInput" placeholder="받은 코드 입력 (대시 있어도 OK)" maxlength="20" style="margin-bottom:8px;" />
        <input class="pw-input-mini" id="joinPwInput" maxlength="6" inputmode="numeric" placeholder="비밀번호 6자리" />
        <button class="save-btn ready" id="joinRoomBtn">연결하기</button>
        <div class="join-error" id="joinError"></div>
      </div>
    </div>

    <div class="install-tip">
      📲 <b>홈 화면에 추가하기</b><br/>
      아이폰 Safari 하단의 공유 버튼(⬆️)을 누르고 "홈 화면에 추가"를 선택하면, 이 페이지가 진짜 앱처럼 아이콘으로 생겨요.
    </div>
  </div>

  <!-- ═══ 하단 탭바 ═══ -->
  <div class="tabbar">
    <button class="tabbtn active" data-tab="home"><span class="ic">🏠</span><span class="lb">홈</span></button>
    <button class="tabbtn" data-tab="calendar"><span class="ic">📅</span><span class="lb">캘린더</span></button>
    <button class="tabbtn" data-tab="add"><span class="ic">➕</span><span class="lb">등록</span></button>
    <button class="tabbtn" data-tab="settings"><span class="ic">⚙️</span><span class="lb">설정</span></button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<!-- Firebase SDK (compat 버전 - 초보자도 쉽게 쓸 수 있는 방식) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
